<!DOCTYPE html>

<html lang="en-AU">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Caleb Captures - Contact</title>
        <link rel="icon" type="image/x-icon" href="/images/favicon.svg">

         <!-- Open Graph Meta Tags for Social Media Preview -->
         <meta property="og:title" content="Caleb Captures - Contact">
         <meta property="og:description" content="Get in touch with Caleb for your photography needs in Brisbane, Australia.">
         <meta property="og:type" content="website">
         <meta property="og:url" content="https://calebcaptures.au/contact/">
        <meta property="og:image" content="https://calebcaptures.au/images/navigation/caleb_captures.svg">
         <meta property="og:image:width" content="1200">
         <meta property="og:image:height" content="630">
         <meta property="og:site_name" content="Caleb Captures">

        <link rel="stylesheet" type="text/css" href="../css/styles.css">
        <link rel="stylesheet" type="text/css" href="../css/contact.css">
    </head>

    <body>
               <nav id="navigation-bar" role="navigation">
    <div id="navigation-bar-outer">
        <div id="mobile-navigation-bar">
            <a id="home-button" href="../">
                <img src="../images/navigation/caleb_captures.svg" class="home-image" alt="Home Button">
            </a>

            <button id="mobile-menu-item-button" onclick="toggleNavigationMenu()">
                <img id="menu-button" src="../images/navigation/menu.svg" alt="Menu Button"/>
            </button>
        </div>

        <div id="navigation-bar-content">
            <ul class="navigation-list">
                <li><a href="../portfolio/">portfolio</a></li>
                <li><a href="../portraits/">portraits</a></li>
                <li><a href="../events/">events</a></li>
                <li><a href="../commercial/">commercial</a></li>

                <li><a href="../about/">about</a></li>
                <li><a href="">contact</a></li>
            </ul>
        </div>
    </div>
</nav>

        <section>
            <div class="contact-content">
                <div class="contact-form">
                    <h2 class="text-on-background-primary">get in touch here</h2>

                    <form id="contact-form">
                        <input type="checkbox" name="botcheck" class="hidden" style="display: none;" tabindex="-1" autocomplete="off">

                        <div id="name-error" class="error-message hide">name is required</div>

                        <label>
                            <input type="text" name="name" placeholder="name"/>
                        </label>

                        <div id="email-error" class="error-message hide">e-mail is required</div>

                        <label>
                            <input type="text" name="email" placeholder="e-mail"/>
                        </label>

                        <label>
                            <input type="text" name="budget" placeholder="budget"/>
                        </label>

                        <div id="subject-error" class="error-message hide">subject is required</div>

                        <label>
                            <input type="text" name="subject" placeholder="subject"/>
                        </label>

                        <div id="message-error" class="error-message hide">message is required</div>

                        <label>
                            <textarea name="message" placeholder="message" rows="6"></textarea>
                        </label>

                        <button id="send-message">send message</button>
                    </form>

                    <h3 id="contact-form-submission-message" class="hide">thanks! message received</h3>

                </div>

                <div class="contact-information-container">
                    <h2>or here</h2>

                    <div class="contact-information-section">
                        <div class="contact-information-image-container">
                            <img class="contact-information-image" src="../images/contact/mail.svg" alt="Email Icon">
                        </div>

                        <div>
                            <p class="contact-information-label">email: calebcaptures.au@gmail.com</p>
                        </div>
                    </div>

                    <a href="https://www.instagram.com/calebcaptures.au/" target="_blank">
                        <div class="contact-information-section">
                            <div class="contact-information-image-container">
                                <img class="contact-information-image" src="../images/contact/Instagram_Glyph_Black.svg" alt="Instagram Logo Icon">
                            </div>

                            <div>
                                <p class="contact-information-label">instagram: @calebcaptures.au</p>
                            </div>
                    </div>
                    </a>

                    <a href="https://www.facebook.com/CalebCaptures.au/" target="_blank">
                        <div class="contact-information-section">
                            <div class="contact-information-image-container">
                                <img class="contact-information-image" src="../images/contact/Facebook_Logo_Primary.png" alt="Facebook Logo Icon">
                            </div>

                            <div>
                                <p class="contact-information-label">facebook: CalebCaptures.au</p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </section>

        <script src="https://web3forms.com/client/script.js" async defer></script>
        <script src="contact.js"></script>

        <script src="../navigation.js"></script>
    </body>
</html>
