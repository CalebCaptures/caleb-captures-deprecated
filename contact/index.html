<!DOCTYPE html>

<html lang="en-AU">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Caleb Captures - Contact</title>
    </head>

    <body>
        <nav role="navigation">
            <div>
                <a id="home-button" href="../index.html">
                    <img src="../images/navigation/photo_camera.svg" alt="Home Button">
                    Caleb Captures
                </a>
            </div>

            <div>
                <ul>
                    <li><a href="../portfolio.html">Portfolio</a></li>
                    <li><a href="../services.html">Services</a></li>
                    <li><a href="index.html">Contact</a></li>
                </ul>
            </div>
        </nav>

        <section>
            <h1>Contact</h1>

            <div class="contact-content">
                <div class="contact-form">
                    <h2>Send a Message</h2>

                    <form>
                        <label>
                            <input type="text" name="name" placeholder="Name"/>
                        </label>

                        <label>
                            <input type="text" name="email" placeholder="E-mail"/>
                        </label>

                        <label>
                            <textarea name="message" placeholder="Message" rows="6"></textarea>
                        </label>

                        <button>Send Message</button>
                    </form>

                </div>

                <div class="contact-information-container">
                    <h2>Get in Touch</h2>

                    <div class="contact-information-section">
                        <img class="contact-information-image" src="../images/contact/mail.svg" alt="Email Icon">

                        <div class="contact-information-label-and-value">
                            <h3 class="contact-information-label">Email</h3>
                            <p class="contact-information-value">calebcaptures.au@gmail.com</p>
                        </div>
                    </div>

                    <div class="contact-information-section">
                       <img class="contact-information-image" src="../images/contact/instagram.svg" alt="Instagram Logo Icon">

                       <div class="contact-information-label-and-value">
                           <h3 class="contact-information-label">Instagram</h3>
                           <p class="contact-information-value">
                               <a href="https://www.instagram.com/calebcaptures.au/">@calebcaptures.au</a>
                           </p>
                       </div>
                   </div>
                </div>
            </div>
        </section>
    </body>

    <header>
        <link rel="stylesheet" type="text/css" href="../css/styles.css">
        <link rel="stylesheet" type="text/css" href="../css/contact.css">
    </header>

</html>
