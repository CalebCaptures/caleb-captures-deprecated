<!DOCTYPE html>

<html lang="en-AU">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caleb Captures - Portfolio</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.svg">

    <link rel="stylesheet" type="text/css" href="../css/styles.css">
    <link rel="stylesheet" type="text/css" href="../css/portfolio.css">
</head>

<body>

<nav id="navigation-bar" role="navigation">
    <div id="navigation-bar-outer">
        <div id="mobile-navigation-bar">
            <a id="home-button" href="../">
                <img src="../images/navigation/caleb_captures.svg" class="home-image" alt="Home Button">
            </a>

            <button id="mobile-menu-item-button" onclick="toggleNavigationMenu()">
                <img id="menu-button" src="../images/navigation/menu.svg" alt="Menu Button"/>
            </button>
        </div>

        <div id="navigation-bar-content">
            <ul class="navigation-list">
                <li><a href="">portfolio</a></li>
                <li><a href="../services/">services</a></li>

                <li><a href="../about/">about</a></li>
                <li><a href="../contact/">contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<section>
    <nav role="tablist">
        <button id="allTab" class="hide" data-filter="all"><a href="#all" class="tab-anchor">all</a></button>
        <button id="portraitureTab" data-filter="portraits"><a href="#portraits" class="tab-anchor">portraits</a></button>
        <button id="eventTab" data-filter="events"><a href="#events" class="tab-anchor">events</a></button>
        <button id="commercialTab" data-filter="commercial"><a href="#commercial" class="tab-anchor">commercial</a></button>
<!--        <button id="personalWorkTab"><a href="#personal-work" class="tab-anchor">personal work</a></button>-->
    </nav>

</section>
<section class="newSection">
    <div id="personal-work-text" class="hide">
        <p>Some of my favourite shots I take on my own time.</p>
        <p>Prints available - <a id="personal-work-contact" href="../contact/">contact</a> for sizing and prices</p>
    </div>
    <div class="jim">
        <div class="test">
            <div id="gallery-column-1" class="test2"></div>
            <div id="gallery-column-2" class="test2"></div>
            <div id="gallery-column-3" class="test2"></div>
        </div>
    </div>
</section>

<div id="lightbox" class="lightbox">
    <div class="lightbox-information-and-actions">
        <button id="lightbox-fullscreen" aria-label="Full Screen">⛶</button>
        <p id="lightbox-counter"></p>
        <button class="lightbox-close" aria-label="Close">&times;</button>
    </div>
    <div class="lightbox-image-container">
        <img id="chevron-backward" src="../images/portfolio/chevron_backward.svg" alt="Previous Image Button">
        <img id="lightbox-image" class="lightbox-image" src="" alt="">
        <img id="chevron-forward" src="../images/portfolio/chevron_forward.svg" alt="Next Image Button">
    </div>
</div>

<script src="portfolio.js"></script>
<script src="../navigation.js"></script>
</body>

</html>
