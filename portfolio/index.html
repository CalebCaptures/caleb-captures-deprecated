<!DOCTYPE html>

<html lang="en-AU">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caleb Captures - Portfolio</title>

    <link rel="stylesheet" type="text/css" href="../css/styles.css">
    <link rel="stylesheet" type="text/css" href="../css/portfolio.css">
</head>

<body>
<nav id="navigation-bar" role="navigation">
    <div>
        <ul class="navigation-list">
            <li><a href="" class="navigation-selected">portfolio</a></li>
            <li><a href="../services/">services</a></li>
            <li>
                <a id="home-button" href="../">
                    <img src="../images/navigation/caleb_captures.svg" class="home-image" alt="Home Button">
                </a>
            </li>
            <li><a href="../about/">about</a></li>
            <li><a href="../contact/">contact</a></li>
        </ul>
    </div>
</nav>

<section>
    <nav role="tablist">
        <button id="allTab" class="hide">all</button>
        <button id="portraitureTab">portraits</button>
        <button id="eventTab">events</button>
        <button id="venueTab" class="hide">venues</button>
        <button id="personalWorkTab">personal work</button>
    </nav>

</section>
<section class="newSection">
    <div id="personal-work-text" class="hide">
        <p>Some of my favourite shots I take on my own time.</p>
        <p>Prints available - <a id="personal-work-contact" href="../contact/">contact</a> for sizing and prices</p>
    </div>
    <div class="jim">
        <div class="test">
            <div id="gallery-column-1" class="test2"></div>
            <div id="gallery-column-2" class="test2"></div>
            <div id="gallery-column-3" class="test2"></div>
        </div>
    </div>
</section>

<div id="lightbox" class="lightbox">
    <div class="lightbox-information-and-actions">
        <button id="lightbox-fullscreen" aria-label="Full Screen">⛶</button>
        <p id="lightbox-counter"></p>
        <button class="lightbox-close" aria-label="Close">&times;</button>
    </div>
    <div class="lightbox-image-container">
        <img id="chevron-backward" src="../images/portfolio/chevron_backward.svg" alt="Previous Image Button">
        <img id="lightbox-image" class="lightbox-image" src="" alt="">
        <img id="chevron-forward" src="../images/portfolio/chevron_forward.svg" alt="Next Image Button">
    </div>
</div>

<script src="portfolio.js"></script>
</body>

</html>
