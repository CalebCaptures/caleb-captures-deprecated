    <head>

        <link rel="icon" type="image/x-icon" href="/images/favicon.svg">

    <body>
            <nav id="navigation-bar" role="navigation">
    <div id="navigation-bar-outer">
        <div id="mobile-navigation-bar">
            <a id="home-button" href="../">
                <img src="../images/navigation/caleb-captures-logo.svg" class="home-image" alt="Home Button">
            </a>

            <button id="mobile-menu-item-button" onclick="toggleNavigationMenu()">
                <img id="menu-button" src="../images/navigation/menu.svg" alt="Menu Button"/>
            </button>
        </div>

        <div id="navigation-bar-content">
            <ul class="navigation-list">
                <li><a href="../portraits/">portraits</a></li>

                <li><a href="../about/">about</a></li>

        <section>
            <div class="hero-wrap">
                <img src="../images/events/hero.jpg" alt="Caleb Captures events hero image" class="hero-image">
                <h1 class="hero-title">Events</h1>
            </div>

            <div class="offering">
                <p class="text-on-background-primary">Candid coverage that doesn&rsquo;t interrupt the occasion.</p>
                <p class="text-on-background-primary">Special days, Celebrations, Conferences.</p>
                <br>
                <p class="text-on-background-primary center">Got an event coming up? <a href="../contact/">Tell me about it</a>.</p>
            </div>

            <div class="photo-grid subcol-photos landscape">
                <div class="subcol">
                    <h3>Weddings</h3>
                    <img data-group="weddings" src="../images/events/wedding-hero.jpg" alt="Caleb Captures wedding photo" loading="lazy" decoding="async">
                </div>
                <div class="subcol">
                    <h3>Social</h3>
                    <img data-group="social" src="../images/events/social-hero.jpg" alt="Caleb Captures social event photo" loading="lazy" decoding="async">
                </div>
                <div class="subcol">
                    <h3>Industry</h3>
                    <img data-group="industry" src="../images/events/industry-hero.jpg" alt="Caleb Captures industry event photo" loading="lazy" decoding="async">
                </div>
            </div>

            <h2 class="section-heading">Kind words</h2>
            <div class="quote-list">
                <figure class="quote">
                    <blockquote>
                        <p class="testimonial">Incredible!! We were so lucky to have such a talented photographer capture our event <span class="emoji">&#128525;</span></p>
                    </blockquote>
                    <figcaption>&mdash; Jess Clarke</figcaption>
                </figure>
                <figure class="quote">
                    <blockquote>
                        <p class="testimonial">Caleb made the day feel easy and relaxed, and I love how the photos turned out. I will be booking again!</p>
                    </blockquote>
                    <figcaption>&mdash; Aylish Tan</figcaption>
                </figure>
                <figure class="quote">
                    <blockquote>
                        <p class="testimonial">I had such a great experience collaborating with Caleb for a shoot. I&rsquo;d definitely love to work with him again and would happily recommend to anyone looking for an amazing photographer! <span class="emoji">&#128076;</span></p>
                    </blockquote>
                    <figcaption>&mdash; Anisha Mahato</figcaption>
                </figure>
            </div>

            <h2 class="section-heading">More from Events</h2>
            <div class="photo-grid grouped-by-three landscape">
                <img data-group="weddings" src="../images/events/wedding-grid-1.jpg" alt="Caleb Captures wedding photo" loading="lazy" decoding="async">
                <img data-group="weddings" src="../images/events/wedding-grid-2.jpg" alt="Caleb Captures wedding photo" loading="lazy" decoding="async">
                <img data-group="weddings" src="../images/events/wedding-grid-3.jpg" alt="Caleb Captures wedding photo" loading="lazy" decoding="async">
                <img data-group="social" src="../images/events/social-grid-1.jpg" alt="Caleb Captures social event photo" loading="lazy" decoding="async">
                <img data-group="social" src="../images/events/social-grid-2.jpg" alt="Caleb Captures social event photo" loading="lazy" decoding="async">
                <img data-group="social" src="../images/events/social-grid-3.jpg" alt="Caleb Captures social event photo" loading="lazy" decoding="async">
                <img data-group="industry" src="../images/events/industry-grid-1.jpg" alt="Caleb Captures industry event photo" loading="lazy" decoding="async">
                <img data-group="industry" src="../images/events/industry-grid-2.jpg" alt="Caleb Captures industry event photo" loading="lazy" decoding="async">
                <img data-group="industry" src="../images/events/industry-grid-3.jpg" alt="Caleb Captures industry event photo" loading="lazy" decoding="async">
            </div>

            <div class="cta-wrap">
                <a href="../contact/" class="cta-button">Let&rsquo;s plan your day</a>
            </div>
        </section>
        <div id="lightbox" class="lightbox">
            <div class="lightbox-information-and-actions">
                <p id="lightbox-counter"></p>
                <button class="lightbox-close" aria-label="Close">&times;</button>
            </div>
            <div class="lightbox-image-container">
                <img id="chevron-backward" src="../images/portfolio/chevron_backward.svg" alt="Previous Image Button">
                <img id="lightbox-image" class="lightbox-image" src="" alt="">
                <img id="chevron-forward" src="../images/portfolio/chevron_forward.svg" alt="Next Image Button">
            </div>
        </div>
        <script src="../navigation.js"></script>
        <script src="../lightbox.js"></script>
